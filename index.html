<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>גלגל השאלות</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#00609d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Secular+One&display=swap">
<style>
html{color-scheme:light dark;overflow-x:hidden}body{margin:0;overflow-x:hidden}
/* The spinning square canvas sticks out past the page edge mid-rotation; clipping stops phones from zooming out. */

/* Layout: heading on top, then wheel (right) beside the question card (left) on wide screens; stacked on phones. */
/* Brand palette taken from the logo: blue #00609d, red #ed1b24, yellow #ebde14, silver #bcbdc1, charcoal #231f20 */
:root {
  --bg: #edf1f6;
  --surface: #ffffff;
  --fg: #141821;
  --muted: #536077;
  --line: #d3dae4;
  --accent: #00609d;
  --accent-ink: #ffffff;
  --red: #d81e27;
  --yellow: #ebde14;
  --glow: rgba(0, 96, 157, .14);
  --s1: #00609d; --i1: #ffffff;
  --s2: #d81e27; --i2: #ffffff;
  --s3: #231f20; --i3: #ffffff;
  --s4: #ebde14; --i4: #231f20;
  --s5: #bcbdc1; --i5: #231f20;
  --font-display: "Secular One", "Arial Hebrew", Arial, sans-serif;
  --font-body: "Assistant", "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #07111e;
    --surface: #0e1c30;
    --fg: #eef2f8;
    --muted: #9aa8bf;
    --line: #213450;
    --accent: #4aa8e6;
    --accent-ink: #07111e;
    --red: #f0444b;
    --glow: rgba(74, 168, 230, .16);
    --s1: #0a6db0; --s2: #e0262e; --s3: #2b2830; --s4: #ebde14; --s5: #c4c5c9;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #07111e;
  --surface: #0e1c30;
  --fg: #eef2f8;
  --muted: #9aa8bf;
  --line: #213450;
  --accent: #4aa8e6;
  --accent-ink: #07111e;
  --red: #f0444b;
  --glow: rgba(74, 168, 230, .16);
  --s1: #0a6db0; --s2: #e0262e; --s3: #2b2830; --s4: #ebde14; --s5: #c4c5c9;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: radial-gradient(1200px 520px at 50% -120px, var(--glow), transparent 70%) no-repeat, var(--bg);
  min-height: 100vh;
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.5;
  padding-block: 28px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { max-width: 1000px; margin: 0 auto; display: grid; gap: 24px; }
h1 {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(2rem, 6vw, 3.1rem);
  line-height: 1.1;
  margin: 0;
  text-wrap: balance;
}
.sub { margin: 6px 0 0; color: var(--muted); }
.brand { display: flex; align-items: center; gap: 18px; }
.brand-logo { width: clamp(64px, 14vw, 92px); height: auto; aspect-ratio: 1; flex: none; filter: drop-shadow(0 6px 14px rgba(0,0,0,.18)); }
.stripe { display: flex; height: 6px; border-radius: 99px; overflow: hidden; margin-top: 18px; max-width: 320px; }
.stripe i { flex: 1; }
.stripe i:nth-child(1) { background: var(--s1); }
.stripe i:nth-child(2) { background: var(--red); }
.stripe i:nth-child(3) { background: var(--yellow); }
.stripe i:nth-child(4) { background: var(--s5); }

.stage { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; align-items: center; }
@media (min-width: 880px) {
  .stage { grid-template-columns: minmax(0, 480px) minmax(0, 1fr); gap: 48px; }
}

.wheel-wrap { position: relative; width: min(100%, 460px); aspect-ratio: 1; margin: 0 auto; }
#wheel {
  display: block; width: 100%; height: 100%;
  border-radius: 50%;
  cursor: pointer;
  box-shadow: 0 0 0 6px var(--surface), 0 0 0 8px var(--line), 0 18px 40px rgba(10, 18, 50, .18);
  transform: rotate(0deg);
}
.pointer {
  position: absolute; top: -14px; left: 50%; width: 34px; height: 42px;
  transform: translateX(-50%); z-index: 2; pointer-events: none;
  filter: drop-shadow(0 2px 3px rgba(0,0,0,.3));
}
.hub {
  position: absolute; top: 50%; left: 50%; width: 27%; aspect-ratio: 1;
  transform: translate(-50%, -50%); border-radius: 50%;
  border: 5px solid var(--surface); padding: 0; overflow: hidden;
  background: var(--surface);
  cursor: pointer; z-index: 2;
  box-shadow: 0 0 0 2px var(--line), 0 6px 18px rgba(0,0,0,.3);
  transition: transform .2s ease;
}
.hub img { display: block; width: 100%; height: 100%; }
.hub:hover:not(:disabled) { transform: translate(-50%, -50%) scale(1.05); }
.hub:disabled { cursor: default; opacity: .85; }
.hub:focus-visible, button:focus-visible, summary:focus-visible, textarea:focus-visible, input:focus-visible {
  outline: 3px solid var(--fg); outline-offset: 3px;
}

.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  border-top: 5px solid var(--red);
  padding: 24px; min-height: 220px; display: flex; flex-direction: column; justify-content: center; gap: 12px;
  min-width: 0;
}
.card .num { font-family: var(--font-display); color: var(--red); font-size: 1.1rem; letter-spacing: .02em; }
.card .q { font-size: clamp(1.5rem, 4.4vw, 2.1rem); line-height: 1.3; font-weight: 600; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.card .hint { color: var(--muted); margin: 0; font-size: 1.1rem; }
.card.pop .q, .card.pop .num { animation: pop .45s ease-out; }
@keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.meta { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; color: var(--muted); font-size: .95rem; }
.meta label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.meta input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; text-decoration: underline; cursor: pointer; }
.tag { display: inline-block; padding: 2px 10px; border: 1px dashed var(--muted); border-radius: 99px; font-size: .85rem; color: var(--muted); }

details.editor { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px 20px; }
details.editor summary { cursor: pointer; padding: 14px 0; font-weight: 600; }
.editor-body { display: grid; gap: 12px; padding-bottom: 20px; }
.editor-body p { margin: 0; color: var(--muted); font-size: .95rem; }
textarea {
  width: 100%; min-height: 260px; resize: vertical; font: inherit; line-height: 1.6;
  background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 12px;
}
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn {
  font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 10px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg);
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.status { color: var(--muted); font-size: .95rem; }
.status.err { color: var(--red); }

@media (prefers-reduced-motion: reduce) {
  .card.pop .q, .card.pop .num { animation: none; }
}
</style>

</head>
<body>
<div class="app" dir="rtl" lang="he">
  <header>
    <div class="brand">
      <img class="brand-logo" src="logo.png" alt="לוגו" width="92" height="92">
      <div>
        <h1>גלגל השאלות</h1>
        <p class="sub">לוחצים על הלוגו שבמרכז הגלגל ומקבלים שאלה.</p>
      </div>
    </div>
    <div class="stripe" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  </header>

  <div class="stage">
    <div class="wheel-wrap">
      <canvas id="wheel" aria-hidden="true"></canvas>
      <svg class="pointer" viewBox="0 0 34 42" aria-hidden="true"><path d="M17 40 L3 6 Q17 -2 31 6 Z" fill="var(--red)" stroke="var(--surface)" stroke-width="3" stroke-linejoin="round"/></svg>
      <button class="hub" id="hub" type="button" aria-label="סובבו את הגלגל"><img src="logo.png" alt="" width="128" height="128"></button>
    </div>

    <div style="display:grid; gap:14px; min-width:0">
      <div class="card" id="card" aria-live="polite">
        <p class="hint" id="hint">לחצו על הגלגל כדי לקבל שאלה.</p>
        <div class="num" id="num" hidden></div>
        <p class="q" id="q" hidden></p>
      </div>
      <div class="meta">
        <span id="count"></span>
        <label for="norepeat"><input type="checkbox" id="norepeat" checked> בלי חזרות</label>
        <button class="linkbtn" id="reset" type="button">איפוס</button>
        <span class="tag" id="sample" hidden>שאלות לדוגמה</span>
      </div>
    </div>
  </div>

  <details class="editor" id="editor">
    <summary>עריכת שאלות</summary>
    <div class="editor-body">
      <p>שאלה אחת בכל שורה. אפשר להדביק 30 עד 40 שאלות בבת אחת. השינוי נשמר בדפדפן הזה בלבד.</p>
      <textarea id="list" spellcheck="false"></textarea>
      <div class="row">
        <button class="btn primary" id="save" type="button">שמירה</button>
        <button class="btn" id="defaults" type="button">החזרה לרשימה המקורית</button>
        <span class="status" id="status" role="status"></span>
      </div>
    </div>
  </details>
</div>

<script>
(function () {
  var DEFAULTS = [
    "ספרו על רגע בעבודה שבו הרגשתם גאווה אמיתית.",
    "ספרו על טעות בעבודה שלמדתם ממנה הרבה.",
    "מי היה הבוס או המנטור הכי טוב שהיה לכם, ומה עשה אותו כזה?",
    "איזה נוהל או כלל בעבודה הייתם משנים, ומה הייתם עושים במקומו?",
    "ספרו על הרגע הכי מצחיק או מביך שזכור לכם מהעבודה.",
    "איזו מיומנות יש לכם שרוב הקולגות לא יודעים עליה, ואיך רכשתם אותה?",
    "איך נראה יום עבודה מושלם בשבילכם, מהבוקר ועד הערב?",
    "איך אתם מתמודדים עם לחץ? ספרו על מקרה אחרון.",
    "מה צריך לקרות כדי שתרגישו שאתם נותנים את המיטב בצוות?",
    "מה כדאי לצוות לדעת עליכם כדי שיהיה קל יותר לעבוד איתכם?",
    "מה הייתם רוצים שהצוות הזה ישיג בשנה הקרובה, ומה התפקיד שלכם בזה?",
    "אילו יכולתם לשנות דבר אחד באופן שבו אנחנו עובדים יחד, מה הוא היה?",
    "מה הייתה העבודה הראשונה שלכם בחיים, ומה למדתם ממנה?",
    "מה רציתם להיות כשהייתם ילדים, ומה נשאר מזה בכם היום?",
    "ספרו על אדם שהשפיע עליכם, ובמה.",
    "איזה לקח למדתם בדרך הקשה?",
    "על איזו הצלחה מחוץ לעבודה אתם הכי גאים, ומה עמד מאחוריה?",
    "איך נראה יום חופש מושלם שלכם, בלי מחויבויות ובלי תקציב?",
    "ספרו על הטיול או החוויה הכי טובים שהיו לכם.",
    "איזה דבר שאתם עושים מחוץ לעבודה מטעין אתכם, ולמה דווקא הוא?",
    "איזו עצה הייתם נותנים לעצמכם בגיל 20?",
    "איזה ספר, סרט או סדרה השאירו בכם חותם, ולמה?",
    "אילו הייתם מארחים ארוחת ערב לשלושה אורחים מכל תקופה, את מי הייתם מזמינים ומה הייתם שואלים אותם?",
    "איזה כוח על הייתם בוחרים, ואיך הייתם משתמשים בו ביום-יום?",
    "איזה הרגל קטן שינה לכם משהו בחיים, ואיך התחלתם אותו?",
    "מה הייתם רוצים ללמוד בשנה הקרובה, ולמה דווקא את זה?",
    "על מה אתם אסירי תודה לאחרונה, בעבודה או מחוצה לה?",
    "ספרו על החלטה קשה שקיבלתם, ומה עזר לכם להחליט.",
    "ספרו על הארוחה הכי טובה שאכלתם בחיים. איפה זה היה ועם מי?",
    "מהי המנה שאתם מכינים הכי טוב, ולמי הכנתם אותה לאחרונה?",
    "איזה מאכל הייתם מוכנים לאכול כל שבוע בלי להשתעמם, ומה הסיפור שלו?",
    "מה הדבר הכי מוזר שאכלתם, ואיפה?",
    "איזה שיר מחזיר אתכם מיד לתקופה אחרת בחיים, ולאיזו?",
    "מה השיר שהיה הפסקול של התקופה הכי טובה שלכם?",
    "ים או הרים? ספרו על המקום האהוב עליכם.",
    "באיזה מקום בעולם הייתם גרים שנה אם הכול היה אפשרי, ולמה?",
    "איזה מקום בארץ אתם ממליצים לכל אחד לבקר בו, ולמה?",
    "ספרו על חופשה או טיול שהשתבשו, ובסוף יצא מזה סיפור טוב.",
    "אתם אנשי בוקר או אנשי לילה, ואיך זה משפיע על היום שלכם?",
    "איזה טקס או הרגל קטן יש לכם בבוקר?",
    "מה הדבר האחרון שגרם לכם לצחוק עד דמעות?",
    "איזה סרט או סדרה ראיתם שוב ושוב, ומה מחזיר אתכם אליהם?",
    "מהי המתנה הכי טובה שקיבלתם או נתתם?",
    "ספרו על חיה, חיית מחמד או זיכרון עם חיה שאתם אוהבים.",
    "איזה ריח, טעם או מקום מחזירים אתכם מיד לילדות?",
    "מהו הדבר הקטן שמשמח אתכם בכל פעם מחדש?",
    "איזה תחביב הייתם רוצים לנסות, ומה מעכב אתכם?",
    "אילו הייתם מקבלים מיליון שקל ועליכם לבזבז אותו בשבוע אחד, מה הייתם עושים?",
    "איזו אפליקציה הייתם מוחקים מהטלפון בלי למצמץ, ואיזו אי אפשר בלעדיה?",
    "את מי הייתם מלהקים לשחק אתכם בסרט על חייכם, ומאיזה ז'אנר הוא היה?",
    "אילו הצוות שלנו היה סרט, מאיזה ז'אנר הוא היה ומי הדמות של כל אחד?",
    "לאיזו חיה הייתם הופכים ליום אחד, ומה הייתם עושים?",
    "איזו תקופה בהיסטוריה הייתם בוחרים לבקר בה ליום אחד, ולמה?",
    "ספרו על משחק, ספורט או תחרות שאתם אוהבים.",
    "מהו האירוע או החגיגה הכי זכורים לכם?",
    "איזו מסורת משפחתית או חג אתם הכי אוהבים, ולמה?",
    "אילו הייתם כותבים ספר, על מה הוא היה?",
    "מה הייתם מלמדים קבוצה של עשרה אנשים בשעה אחת, בלי קשר לעבודה?",
    "מהו הדבר הקטן ביותר שמישהו עשה בשבילכם ונשאר איתכם?",
    "איזו חוויה ראשונה אתם זוכרים הכי טוב, כמו הפעם הראשונה בחו\"ל או מאחורי ההגה?"
  ];
  var KEY = "question-wheel-list-v3";
  var MAX = 80;

  var canvas = document.getElementById("wheel");
  var ctx = canvas.getContext("2d");
  var hub = document.getElementById("hub");
  var card = document.getElementById("card");
  var hint = document.getElementById("hint");
  var numEl = document.getElementById("num");
  var qEl = document.getElementById("q");
  var countEl = document.getElementById("count");
  var noRepeat = document.getElementById("norepeat");
  var sampleTag = document.getElementById("sample");
  var listEl = document.getElementById("list");
  var statusEl = document.getElementById("status");
  var editor = document.getElementById("editor");

  var questions = DEFAULTS.slice();
  var isSample = false;
  var used = new Set();
  var rotation = 0;
  var spinning = false;

  try {
    var saved = localStorage.getItem(KEY);
    if (saved) {
      var arr = JSON.parse(saved);
      if (Array.isArray(arr) && arr.length >= 2) { questions = arr; isSample = false; }
    }
  } catch (e) {}

  function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

  function colorIndex(i, n) {
    var c = i % 5;
    if (i === n - 1 && c === 0) c = 2;
    return c;
  }

  function draw() {
    var size = canvas.clientWidth;
    if (!size) return;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(size * dpr);
    canvas.height = Math.round(size * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, size, size);
    var n = questions.length;
    var c = size / 2;
    var R = c;
    var a = (Math.PI * 2) / n;
    var cols = [css("--s1"), css("--s2"), css("--s3"), css("--s4"), css("--s5")];
    var inks = [css("--i1"), css("--i2"), css("--i3"), css("--i4"), css("--i5")];
    var surface = css("--surface");
    var fontPx = Math.max(10, Math.min(20, size * (n > 40 ? 0.03 : 0.036)));
    ctx.font = "700 " + fontPx + "px " + css("--font-body");
    ctx.textBaseline = "middle";
    ctx.textAlign = "right";
    for (var i = 0; i < n; i++) {
      var start = -Math.PI / 2 + i * a;
      var dim = noRepeat.checked && used.has(i);
      ctx.globalAlpha = dim ? 0.3 : 1;
      ctx.beginPath();
      ctx.moveTo(c, c);
      ctx.arc(c, c, R, start, start + a);
      ctx.closePath();
      var ci = colorIndex(i, n);
      ctx.fillStyle = cols[ci];
      ctx.fill();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = surface;
      ctx.stroke();
      ctx.save();
      ctx.translate(c, c);
      ctx.rotate(start + a / 2);
      ctx.fillStyle = inks[ci];
      ctx.fillText(String(i + 1), R - size * 0.03, 0);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  function updateCount() {
    var n = questions.length;
    if (noRepeat.checked) {
      countEl.textContent = "נשארו " + (n - used.size) + " מתוך " + n + " שאלות";
    } else {
      countEl.textContent = n + " שאלות בגלגל";
    }
    sampleTag.hidden = !isSample;
  }

  function showQuestion(i) {
    hint.hidden = true;
    numEl.hidden = false;
    qEl.hidden = false;
    numEl.textContent = "שאלה " + (i + 1);
    qEl.textContent = questions[i];
    card.classList.remove("pop");
    void card.offsetWidth;
    card.classList.add("pop");
  }

  function pickIndex() {
    var n = questions.length;
    if (noRepeat.checked) {
      if (used.size >= n) used.clear();
      var pool = [];
      for (var i = 0; i < n; i++) if (!used.has(i)) pool.push(i);
      return pool[Math.floor(Math.random() * pool.length)];
    }
    return Math.floor(Math.random() * n);
  }

  function spin() {
    if (spinning) return;
    spinning = true;
    hub.disabled = true;
    var n = questions.length;
    var idx = pickIndex();
    var slice = 360 / n;
    var center = (idx + 0.5) * slice;
    var jitter = (Math.random() - 0.5) * slice * 0.7;
    var targetMod = (((360 - center + jitter) % 360) + 360) % 360;
    var curMod = ((rotation % 360) + 360) % 360;
    var delta = (targetMod - curMod + 360) % 360;
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var turns = reduce ? 1 : 6;
    var ms = reduce ? 600 : 5200;
    rotation = rotation + 360 * turns + delta;
    canvas.style.transition = "transform " + ms + "ms cubic-bezier(.12,.65,.08,1)";
    canvas.style.transform = "rotate(" + rotation + "deg)";
    var done = false;
    function finish() {
      if (done) return;
      done = true;
      canvas.removeEventListener("transitionend", finish);
      spinning = false;
      hub.disabled = false;
      if (noRepeat.checked) used.add(idx);
      draw();
      updateCount();
      showQuestion(idx);
    }
    canvas.addEventListener("transitionend", finish);
    setTimeout(finish, ms + 250);
  }

  function resetWheel() {
    used.clear();
    draw();
    updateCount();
  }

  function setQuestions(list, sample) {
    questions = list;
    isSample = sample;
    used.clear();
    rotation = 0;
    canvas.style.transition = "none";
    canvas.style.transform = "rotate(0deg)";
    hint.hidden = false;
    numEl.hidden = true;
    qEl.hidden = true;
    draw();
    updateCount();
  }

  function setStatus(msg, err) {
    statusEl.textContent = msg;
    statusEl.className = "status" + (err ? " err" : "");
  }

  hub.addEventListener("click", spin);
  canvas.addEventListener("click", spin);
  noRepeat.addEventListener("change", function () { draw(); updateCount(); });
  document.getElementById("reset").addEventListener("click", resetWheel);

  document.getElementById("save").addEventListener("click", function () {
    var lines = listEl.value.split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
    if (lines.length < 2) { setStatus("צריך לפחות 2 שאלות.", true); return; }
    if (lines.length > MAX) { setStatus("אפשר עד " + MAX + " שאלות. הוספתם " + lines.length + ".", true); return; }
    try { localStorage.setItem(KEY, JSON.stringify(lines)); } catch (e) {}
    setQuestions(lines, false);
    setStatus("נשמרו " + lines.length + " שאלות.", false);
  });

  document.getElementById("defaults").addEventListener("click", function () {
    try { localStorage.removeItem(KEY); } catch (e) {}
    listEl.value = DEFAULTS.join("\n");
    setQuestions(DEFAULTS.slice(), false);
    setStatus("חזרה הרשימה המקורית.", false);
  });

  listEl.value = questions.join("\n");
  if (location.hash === "#edit") editor.open = true;

  if (window.ResizeObserver) new ResizeObserver(draw).observe(canvas); else window.addEventListener("resize", draw);
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
  new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);

  draw();
  updateCount();
})();
</script>
</body>
</html>
